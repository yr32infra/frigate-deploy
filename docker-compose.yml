services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.3@sha256:52ee4a7b4aa403347c1f31974d4faafc7157f97933c08c905c08ec6599f4f27a
    hostname: frigate
    container_name: frigate__frigate
    restart: unless-stopped

    ports:
      - 5000:5000
      - 8971:8971

    volumes:
      - type: bind
        source: ./config
        target: /config

      - type: bind
        source: ./storage
        target: /media/frigate

      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    shm_size: 512m

    deploy:
      resources:
        limits:
          memory: 8g

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    hostname: cloudflared
    container_name: frigate__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      default:

networks:
  default:
    name: frigate__default
