services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.1@sha256:0171060cb020ba25e6e94746004842b04783c7482b76406d6a707a275bb187f4
    hostname: frigate
    container_name: frigate__frigate
    restart: unless-stopped

    ports:
      - 5000:5000
      - 8971:8971

    volumes:
      - type: bind
        source: ./config
        target: /config

      - type: bind
        source: ./storage
        target: /media/frigate

      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    shm_size: 512m

    deploy:
      resources:
        limits:
          memory: 8g

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    hostname: cloudflared
    container_name: frigate__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      default:

networks:
  default:
    name: frigate__default
