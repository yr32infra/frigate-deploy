services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2@sha256:06e48c72f5af2887eafff09a4c53e8df9238827ae9e8df811cbdeaab1c7a4330
    hostname: frigate
    container_name: frigate__frigate
    restart: unless-stopped

    ports:
      - 5000:5000
      - 8971:8971

    volumes:
      - type: bind
        source: ./config
        target: /config

      - type: bind
        source: ./storage
        target: /media/frigate

      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    shm_size: 512m

    deploy:
      resources:
        limits:
          memory: 8g

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    hostname: cloudflared
    container_name: frigate__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      default:

networks:
  default:
    name: frigate__default
